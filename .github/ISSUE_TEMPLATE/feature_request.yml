name: 💡 Feature Request
description: Suggest a new feature or enhancement for Supremo Discord Bot
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible to help us understand your request.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A clear and concise description of the feature you'd like to see
      placeholder: Describe the feature in one or two sentences...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
      placeholder: |
        As a [type of user], I want [goal] so that [benefit].
        
        Currently, [describe current limitation or problem]...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working
      placeholder: |
        The feature should work by...
        
        User interface:
        - ...
        
        Functionality:
        - ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component would this feature affect?
      options:
        - Backend API
        - Frontend Dashboard
        - Discord Bot Commands
        - Moderation System
        - Automation/Workflows
        - Analytics/Reporting
        - User Management
        - Configuration
        - Mobile App
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would be helpful
        - High - Important for my use case
        - Critical - Blocking my usage
    validations:
      required: true

  - type: dropdown
    id: user-type
    attributes:
      label: User Type
      description: What type of user would benefit from this feature?
      multiple: true
      options:
        - Server Owner
        - Administrator
        - Moderator
        - Regular Member
        - Bot Developer
        - Community Manager
        - All Users
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: |
        Alternative 1: ...
        Alternative 2: ...
        
        Current workaround: ...

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Provide examples, mockups, or references to similar features in other tools
      placeholder: |
        Similar feature in [other tool]: ...
        
        Example scenario: ...

  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical Considerations
      description: Any technical aspects to consider? (Optional - for technical users)
      placeholder: |
        API changes needed: ...
        Database changes: ...
        Performance impact: ...

  - type: checkboxes
    id: feature-scope
    attributes:
      label: Feature Scope
      description: What aspects should this feature include?
      options:
        - label: User interface changes
        - label: API endpoints
        - label: Database schema changes
        - label: Discord bot commands
        - label: Webhook integrations
        - label: Mobile support
        - label: Documentation updates

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided a clear use case for this feature
          required: true
        - label: I understand this is a request and not a guarantee of implementation
          required: true